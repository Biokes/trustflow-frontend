name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-build:
    name: Lint, Typecheck & Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Node 18 is the project minimum (.nvmrc). Node 20 covers the
        # next LTS. sharp@0.33.5 and @testing-library/jest-dom@6 both
        # support Node >=18.
        node-version: [18, 20]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        # Use npm install rather than npm ci so that a stale lock file
        # does not block the build. The lock file is updated in-place and
        # the result is cached by the setup-node cache step above.
        run: npm install --prefer-offline

      - name: Verify contract bindings are up-to-date
        run: npm run codegen:validate

      - name: TypeScript type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test
